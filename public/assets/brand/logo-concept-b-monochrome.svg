<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160">
  
  <g transform="translate(40, 20)">
    <!-- Octagonal Royal Medallion (110x110) -->
    <g transform="translate(10, 5)">
      <!-- Outer Octagon -->
      <polygon points="55,5 90,20 105,55 90,90 55,105 20,90 5,55 20,20" 
               fill="none" stroke="#302825" stroke-width="2"/>
      <!-- Inner Octagon -->
      <polygon points="55,13 83,25 95,55 83,85 55,97 27,85 15,55 27,25" 
               fill="#302825" fill-opacity="0.12" stroke="#302825" stroke-width="1"/>
      <!-- Central Diamond & Crest Monogram -->
      <polygon points="55,28 75,55 55,82 35,55" fill="none" stroke="#302825" stroke-width="1.5"/>
      <circle cx="55" cy="55" r="14" fill="#302825"/>
      <!-- Interlocked D Monogram -->
      <text x="55" y="61" font-family="'Playfair Display', Georgia, serif" 
            font-size="16" font-weight="700" fill="#F8F4EC" text-anchor="middle">
        D
      </text>
      <!-- Four Corner Starlets -->
      <circle cx="55" cy="18" r="1.5" fill="#302825"/>
      <circle cx="55" cy="92" r="1.5" fill="#302825"/>
      <circle cx="18" cy="55" r="1.5" fill="#302825"/>
      <circle cx="92" cy="55" r="1.5" fill="#302825"/>
    </g>

    <!-- Typography Block -->
    <g transform="translate(145, 18)">
      <text x="0" y="32" font-family="'Amiri', 'IBM Plex Sans Arabic', serif" 
            font-size="31" font-weight="700" fill="#302825" letter-spacing="0.04em">
        ضيوف الرحمن
      </text>
      
      <!-- Crest Divider Line -->
      <line x1="0" y1="46" x2="280" y2="46" stroke="#302825" stroke-width="1" stroke-opacity="0.4"/>
      <polygon points="140,43 144,46 140,49 136,46" fill="#302825"/>

      <text x="0" y="68" font-family="'Playfair Display', Georgia, serif" 
            font-size="16" font-weight="700" fill="#302825" letter-spacing="0.2em">
        DUYUF ALRAHMAN VIP
      </text>
      <text x="0" y="88" font-family="'DM Sans', sans-serif" 
            font-size="9" font-weight="600" fill="#6A625E" letter-spacing="0.28em">
        HAUTE MOBILITÉ &amp; SERVICE ROYAL
      </text>
    </g>
  </g>
</svg>