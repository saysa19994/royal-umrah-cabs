<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B14B" />
      <stop offset="35%" stop-color="#FBF2D5" />
      <stop offset="70%" stop-color="#D6A13A" />
      <stop offset="100%" stop-color="#A27420" />
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF2D5" />
      <stop offset="50%" stop-color="#D6A13A" />
      <stop offset="100%" stop-color="#7A5212" />
    </linearGradient>
    <filter id="royalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ROYAL CREST ICON (EMBLEM) -->
  <g transform="translate(4, 6)" filter="url(#royalGlow)">
    <!-- Outer Shield Diamond / Islamic Geometry -->
    <rect x="18" y="2" width="28" height="28" rx="4" transform="rotate(45 32 16)" fill="none" stroke="url(#goldStroke)" stroke-width="1.5" opacity="0.85" />
    <circle cx="32" cy="16" r="19" fill="#090D15" stroke="url(#goldStroke)" stroke-width="1.2" />

    <!-- Royal Crown Motif -->
    <path d="M22 23 L24 13 L28 17 L32 9 L36 17 L40 13 L42 23 Z" fill="url(#goldGrad)" opacity="0.95" />

    <!-- Crown Jewel Stars -->
    <circle cx="32" cy="7" r="1.5" fill="#FFF8E7" />
    <circle cx="24" cy="11.5" r="1.2" fill="#FFF8E7" />
    <circle cx="40" cy="11.5" r="1.2" fill="#FFF8E7" />

    <!-- Monogram D / Calligraphic Flourish -->
    <path d="M26 27 C26 24 38 24 38 27 C38 29 34 30 32 30 C30 30 26 29 26 27 Z" fill="url(#goldGrad)" />
    <line x1="22" y1="32" x2="42" y2="32" stroke="url(#goldStroke)" stroke-width="1" stroke-linecap="round" />
    <circle cx="32" cy="35" r="1" fill="url(#goldGrad)" />
  </g>

  <!-- BRAND TYPOGRAPHY (BILINGUAL LUXURY) -->
  <!-- Latin Brand Name -->
  <text x="74" y="28" font-family="'Cinzel', 'Cinzel Decorative', 'Playfair Display', 'Times New Roman', Georgia, serif" font-size="19" font-weight="700" letter-spacing="0.14em" fill="#FFFFFF">
    DUYUF ALRAHMAN
  </text>
  
  <!-- VIP Badge -->
  <rect x="272" y="14" width="48" height="18" rx="3" fill="url(#goldGrad)" />
  <text x="296" y="27" font-family="'Cinzel', 'Times New Roman', sans-serif" font-size="11" font-weight="900" letter-spacing="0.16em" fill="#090D15" text-anchor="middle">
    VIP
  </text>

  <!-- Arabic Sub-brand & Subtitle -->
  <text x="75" y="48" font-family="'Amiri', 'Traditional Arabic', 'Scheherazade', serif" font-size="15" font-weight="700" fill="url(#goldGrad)" letter-spacing="0.04em">
    ضيوف الرحمن VIP
  </text>
  <text x="180" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.22em" fill="#AEB7C4" text-transform="uppercase">
    • ROYAL PRIVATE CHAUFFEUR
  </text>
</svg>