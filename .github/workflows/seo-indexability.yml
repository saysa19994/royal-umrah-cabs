name: SEO Indexability Guard

on:
  pull_request:
    paths:
      - 'src/app/sitemap.ts'
      - 'src/app/sitemap.xml/route.ts'
      - 'src/app/[locale]/blog/[slug]/page.tsx'
      - 'src/app/[locale]/guides/**'
      - 'src/lib/seo/**'
      - 'src/middleware.ts'
      - 'scripts/test-seo-geo-aeo.mjs'
      - 'package.json'
      - '.github/workflows/seo-indexability.yml'
  push:
    branches:
      - 'seo-geo-aeo-recovery-20261121'

permissions:
  contents: read

jobs:
  indexability:
    name: Validate SEO policy and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run SEO regression suite
        run: node --test scripts/test-seo-geo-aeo.mjs
      - name: Check locale dictionaries
        run: npm run check-i18n
      - name: TypeScript typecheck
        run: npm run typecheck
